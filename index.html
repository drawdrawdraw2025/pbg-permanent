function openWith(url, e){
  if(e) e.preventDefault();
  // Try Android intent for Open-with chooser (browsers, etc)
  const isAndroid = /Android/i.test(navigator.userAgent);
  if(isAndroid){
    try{
      const intent = 'intent://' + url.replace(/^https:\/\//,'') + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
      window.location.href = intent;
      // Fallback to https after 700ms if intent not handled (desktop will stay)
      setTimeout(()=>{ window.location.href = url; }, 900);
      return false;
    }catch(err){}
  }
  window.open(url, '_blank');

}
